name: Deploy to GitHub Pages

# Deploys from main, not develop. The build stamps version.json with the
# built commit's short SHA (see vite.config.ts resolveBuildHash), so
# deploying develop meant the live hash was always the commit BEFORE the
# merge commit that main ends up carrying - the app looked one commit
# stale next to GitHub's branch view even though the tree was identical.
# Deploying main makes the live hash the newest commit, and merging is
# the single deploy trigger instead of push-then-merge deploying twice.
#
# To preview a develop branch on Pages before merging, run this workflow
# manually (workflow_dispatch) from that branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest deploy matters; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

# Coerce any straggler JavaScript action still declaring Node 20 to
# Node 24 (matches ci.yml; Node 20 is removed 2026-09-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Node stays the build RUNTIME (Vite, workbox); bun only installs
      # and runs the script. Both are set up here on purpose - this is
      # the single path to the live PWA, so it keeps the runtime
      # explicit rather than relying on bun's bundled Node shim.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install and build for GitHub Pages
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          GITHUB_PAGES=true VITE_STORAGE_MODE=dexie bun run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v5
